name: Release

# Alternative distribution, and the reason it is automated rather than manual:
# a release built by hand is a release whose provenance is one person's memory.
# This one is built from a tag, signed with the project's own key held in GitHub
# secrets, and published with the checks that matter printed in the notes.
#
# It does NOT publish to the Meta Horizon Store. That path needs review and is
# described in docs/horizon-store-readiness.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify the requested tag is the checked-out revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - name: Check documentation and release validation regressions
        run: |
          python3 -m unittest discover -s Tools/tests -v
          python3 Tools/check_docs.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install the pinned Android toolchain
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # The keystore arrives base64-encoded in a secret and is written straight to a
      # file outside the workspace. It is never echoed, never logged, and never lands
      # in the build directory where an artifact step could pick it up.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NICEGRAM_VR_KEYSTORE_BASE64 }}
        run: |
          set -eo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::NICEGRAM_VR_KEYSTORE_BASE64 is not set. A release build must be"
            echo "::error::signed with the project key; the development keystore in this"
            echo "::error::repository must never sign a published build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "keystore restored, $(stat -c%s "$RUNNER_TEMP/release.jks") bytes"

      - name: Build the signed release
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          NICEGRAM_VR_KEYSTORE_PASSWORD: ${{ secrets.NICEGRAM_VR_KEYSTORE_PASSWORD }}
          NICEGRAM_VR_KEY_ALIAS: ${{ secrets.NICEGRAM_VR_KEY_ALIAS }}
          NICEGRAM_VR_KEY_PASSWORD: ${{ secrets.NICEGRAM_VR_KEY_PASSWORD }}
        run: |
          set -eo pipefail
          export NICEGRAM_VR_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew -PquestAbiOnly :TMessagesProj_AppQuest:testQuestDebugUnitTest :TMessagesProj_AppQuest:assembleQuestStandalone --no-daemon

      - name: Check the package before anyone downloads it
        id: checks
        run: |
          set -euo pipefail
          apk=TMessagesProj_AppQuest/build/outputs/apk/quest/standalone/nicegram-vr.apk
          curl -fLsS --retry 2 --max-time 60 \
            https://developers.meta.com/horizon/resources/permissions-prohibited/ \
            -o "$RUNNER_TEMP/prohibited.html"
          python3 Tools/check_release.py "$apk" \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            --prohibited-html "$RUNNER_TEMP/prohibited.html" --tag "$RELEASE_TAG" \
            --expected-cert-sha256 7481f8cddfa604bb228c691a344585c7451c7f493c565f82f8926ebcaa60497b \
            --previous-code 7089039 --output release-receipt.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('release-receipt.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for key,value in {'size':f"{r['bytes']/1000000:.1f} MB",'vname':r['version_name'],
                                'vcode':r['version_code'],'perms':len(r['permissions']),
                                'abis':','.join(r['abis'])}.items():
                  print(f'{key}={value}',file=out)
          PY
          cp "$apk" "nicegram-vr-$RELEASE_TAG.apk"
          shasum -a 256 "nicegram-vr-$RELEASE_TAG.apk" > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            nicegram-vr-*.apk
            release-receipt.json
            SHA256SUMS
          generate_release_notes: true
          # A tag carrying a pre-release suffix publishes as one. The distinction is not
          # cosmetic: until a build has run on real hardware it should not sit at the top of
          # the page looking like the recommended download.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body: |
            **Nicegram VR** - an unofficial, open-source Telegram client for Meta Quest 3 and 3S.

            Not made or endorsed by Telegram. Your account, messages and the rules they follow
            stay Telegram's, under its [Terms](https://telegram.org/tos) and
            [Privacy Policy](https://telegram.org/privacy). This app has its own —
            [Terms of Use](https://nicegram.github.io/Nicegram-VR/terms.html) and
            [Privacy Policy](https://nicegram.github.io/Nicegram-VR/privacy.html) — because it
            asks for a microphone and sends a recording to a service you name, which the phone
            clients' pages do not cover. Support: support@appvillis.com.

            ### Install

            Enable developer mode on the headset, then `adb install -r` the APK below, or
            sideload it with SideQuest. This is not a Horizon Store build.

            ### What was checked before publishing

            | | |
            |---|---|
            | Version | ${{ steps.checks.outputs.vname }}, code ${{ steps.checks.outputs.vcode }} |
            | Size | ${{ steps.checks.outputs.size }} (store limit 1 GB) |
            | ABIs | ${{ steps.checks.outputs.abis }} (64-bit only) |
            | Permissions | ${{ steps.checks.outputs.perms }}, **none prohibited by Meta** |
            | Signature | scheme v2, the project's own key |

            **This build has no push delivery.** Messages and calls can reach it while it
            is running; it cannot wake for new messages while closed.

      - name: Remove restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
