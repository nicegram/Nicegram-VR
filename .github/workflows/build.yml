name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quest-debug:
    name: Quest debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK and CMake this build pins
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/gradle-build-action@v3

      # The two keys, and nothing else. Without them the build stops at the first compile task
      # and names what is missing; it never substitutes a default.
      - name: Build
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: ./gradlew --no-daemon :TMessagesProj_AppQuest:assembleQuestDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: nicegram-vr-quest-debug
          path: TMessagesProj_AppQuest/build/outputs/apk/quest/debug/nicegram-vr.apk
          if-no-files-found: error
