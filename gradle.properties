## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=7089
APP_VERSION_NAME=12.10.3

# Nicegram VR's own version, which is NOT Telegram's.
#
# APP_VERSION_CODE and APP_VERSION_NAME above are upstream's and move when upstream moves. Two
# Nicegram VR releases cut from one upstream base therefore carried the SAME versionCode, and an
# upload with a versionCode that did not increase is refused by the Horizon Store — a release
# blocked at the first minute, for a reason nothing in the repository mentioned.
#
# NICEGRAM_VR_BUILD is bumped for every published build; it gives 100 slots between upstream
# bumps and the arithmetic stays monotonic across them (see TMessagesProj_AppQuest/build.gradle).
# NICEGRAM_VR_VERSION is what a tester reads on the store page, and it is this product's number
# rather than Telegram's.
NICEGRAM_VR_BUILD=3
NICEGRAM_VR_VERSION=0.1.0
APP_PACKAGE=org.telegram.messenger
IS_PRIVATE=false
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.enableResourceOptimizations=true
org.gradle.tooling.parallel=true
