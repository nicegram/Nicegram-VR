// Nicegram VR — the headset build.
//
// Derived from TMessagesProj_AppStandalone, which is upstream's only configuration that
// already excludes Firebase. Three deliberate differences from it:
//   * no google-services plugin and no google-services.json — Horizon OS has no Play services,
//     so a build that demanded one would be a build nobody outside the office could run;
//   * arm64-v8a only — Quest 3 and 3S are arm64, and dropping three ABIs is the single
//     largest saving in native build time for a contributor;
//   * the build fails, loudly and by name, when the two API keys are missing.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.telegram.build-app-plugin'

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'com.meta.spatial:meta-spatial-sdk:0.14.0'
    implementation 'com.meta.spatial:meta-spatial-sdk-toolkit:0.14.0'
    implementation 'com.meta.spatial:meta-spatial-sdk-vr:0.14.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.core:core:1.16.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
    // The silence rule is the product, so it is tested on the JVM and runs on every push.
    testImplementation 'junit:junit:4.13.2'
    // org.json ships with Android as stubs that throw in a JVM test. The real
    // implementation on the test classpath is what lets the response parser be
    // tested at all — the alternative is a hand-rolled parser nobody should trust.
    testImplementation 'org.json:json:20231013'
}

// The keys, and only the keys. Everything else in this repository is complete without them.
def questSecret(String name) {
    def value = System.getenv(name)
    if (value == null || value.toString().isEmpty()) {
        def propsFile = rootProject.file('local.properties')
        if (propsFile.exists()) {
            def props = new Properties()
            propsFile.withInputStream { props.load(it) }
            value = props[name]
        }
    }
    return value == null ? "" : value.toString()
}

// A release build without a real keystore is stopped before it produces an artifact that
// looks publishable and is not.
tasks.configureEach { task ->
    if (task.name.contains('Standalone') && (task.name.startsWith('package') || task.name.startsWith('assemble'))) {
        task.doFirst {
            def missing = ['NICEGRAM_VR_KEYSTORE', 'NICEGRAM_VR_KEYSTORE_PASSWORD',
                           'NICEGRAM_VR_KEY_ALIAS', 'NICEGRAM_VR_KEY_PASSWORD']
                    .findAll { questSecret(it).isEmpty() }
            if (!missing.isEmpty()) {
                throw new GradleException(
                    "A release build needs its own signing key: " + missing.join(', ') + " are not set.\n" +
                    "The development keystore in this repository must not sign a published build — its\n" +
                    "password is public and whatever signs the first release is the only key that can\n" +
                    "ever update it.\n" +
                    "Use assembleQuestDebug for sideloading, or supply the four values through the\n" +
                    "environment or local.properties."
                )
            }
            def suppliedKey = file(questSecret('NICEGRAM_VR_KEYSTORE'))
            def developmentKey = rootProject.file('TMessagesProj/config/release.keystore')
            if (!suppliedKey.isFile()) {
                throw new GradleException("The configured release keystore does not exist.")
            }
            if (java.util.Arrays.equals(suppliedKey.bytes, developmentKey.bytes)) {
                throw new GradleException("The public development keystore must not sign a release.")
            }
        }
    }
    if (task.name.startsWith('compile') && task.name.contains('JavaWithJavac')) {
        task.doFirst {
            // Telegram publishes a sample api_id in its own source. It builds and then fails
            // against the network with an error that says nothing useful, so it is refused here
            // where the sentence can. The value is read out of our own import commit rather than
            // written into this file.
            def sampleId = '4'
            if (questSecret('TELEGRAM_APP_ID') == sampleId) {
                throw new GradleException(
                    "TELEGRAM_APP_ID is Telegram's public sample identifier, not an application of\n" +
                    "your own. It compiles and then cannot connect. Register one at\n" +
                    "https://core.telegram.org/api/obtaining_api_id — see docs/production-setup.md."
                )
            }
            def missing = ['TELEGRAM_APP_ID', 'TELEGRAM_APP_HASH'].findAll { questSecret(it).isEmpty() }
            if (!missing.isEmpty()) {
                throw new GradleException(
                    "Nicegram VR cannot be built without " + missing.join(' and ') + ".\n" +
                    "Obtain them at https://core.telegram.org/api/obtaining_api_id, then either\n" +
                    "  * copy local.properties.example to local.properties and fill the values in, or\n" +
                    "  * export them as environment variables (this is what CI does).\n" +
                    "They are never committed: local.properties is in .gitignore."
                )
            }
        }
    }
}

/**
 * Nicegram VR: a required integer property, with the same loudness as the credential guard.
 *
 * Deliberately NOT defaulted. A missing NICEGRAM_VR_BUILD would silently reset the version code
 * to a number below the one already published, and the failure would surface as a rejected
 * upload days later rather than as a message here.
 */
String questVersionProperty(String name) {
    if (!project.hasProperty(name)) {
        throw new GradleException(
            "Nicegram VR cannot be built without " + name + " in gradle.properties.\n" +
            "It carries this product's own version, separate from Telegram's APP_VERSION_* —\n" +
            "the build number is what makes each store upload's versionCode larger than the\n" +
            "last, and the name is what a tester reads. An upstream merge that dropped either\n" +
            "would otherwise reset the version silently, and the failure would surface days\n" +
            "later as a rejected upload."
        )
    }
    return project.property(name).toString().trim()
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    namespace 'my.nicegram.vr'

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    lint {
        disable 'MissingTranslation', 'ExtraTranslation', 'BlockedPrivateApi'
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions { jvmTarget = "17" }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    // Signing, and the difference between the two configs is the whole point.
    //
    // debug is signed with upstream's checked-in keystore, whose password is the word
    // "android" and is in gradle.properties for everyone to read. That is correct for a
    // sideloaded development build and wrong for anything else.
    //
    // release refuses to use it. A store identity is a one-way door: whatever key signs the
    // first published build is the only key that can ever update it, and a build signed with a
    // keystore that is in the repository can be impersonated by anyone who cloned it. So the
    // release config reads a real keystore from the environment or local.properties, and the
    // build fails by name when it is absent rather than quietly falling back.
    signingConfigs {
        debug {
            storeFile file("../TMessagesProj/config/release.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
        release {
            def keystorePath = questSecret('NICEGRAM_VR_KEYSTORE')
            if (!keystorePath.isEmpty() && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword questSecret('NICEGRAM_VR_KEYSTORE_PASSWORD')
                keyAlias questSecret('NICEGRAM_VR_KEY_ALIAS')
                keyPassword questSecret('NICEGRAM_VR_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            minifyEnabled false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
        }
        standalone {
            matchingFallbacks = ['release']
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    flavorDimensions "minApi"

    productFlavors {
        quest {
            ndk {
                abiFilters "arm64-v8a"
            }
            ext {
                abiVersionCode = 9
            }
        }
    }

    defaultConfig {
        applicationId "my.nicegram.vr"
        minSdkVersion 34
        // Meta's release policy names target 34 for newly created Store apps.
        // compileSdk remains 36 for upstream APIs; the 2D range also includes 34.
        targetSdkVersion 34
        // Nicegram VR's version, not Telegram's.
        //
        // versionCode must INCREASE with every store upload, and upstream's APP_VERSION_CODE
        // only moves when upstream does — so two of our releases from one base collided, and
        // the second upload would have been refused. NICEGRAM_VR_BUILD opens 100 slots between
        // upstream bumps, and the arithmetic stays monotonic across them:
        //
        //   7089 build 0  -> (708900)*10+9 = 7089009
        //   7089 build 99 -> (708999)*10+9 = 7089999
        //   7090 build 0  -> (709000)*10+9 = 7090009   <- still larger
        //
        // (the *10+abi is applied by the output override below, unchanged.)
        versionCode Integer.parseInt(APP_VERSION_CODE) * 100 + Integer.parseInt(questVersionProperty('NICEGRAM_VR_BUILD'))
        // What a tester reads. "12.10.3" is the Telegram release this is built on and says
        // nothing about which Nicegram VR they have; both are here, each labelled.
        versionName questVersionProperty('NICEGRAM_VR_VERSION') + " (Telegram " + APP_VERSION_NAME + ")"
        ndkVersion "27.2.12479018"

        multiDexEnabled true
        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21'
                targets 'tmessages.49'
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "nicegram-vr.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    buildFeatures {
        buildConfig = true
    }
}
