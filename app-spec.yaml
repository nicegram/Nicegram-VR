name: nicegram-vr-room-beta
region: fra
services:
  - name: rooms
    git:
      repo_clone_url: https://github.com/nicegram/Nicegram-VR.git
      branch: deploy/room-service
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /healthz
    envs:
      # App Platform's edge overwrites this header with the connecting client's address;
      # every socket otherwise comes from the same edge. Verified live, see the service README.
      - key: CLIENT_IP_HEADER
        scope: RUN_TIME
        value: do-connecting-ip
      - key: NICEGRAM_API_BASE_URL
        scope: RUN_TIME
        value: https://nicegram.cloud/api/
      - key: NICEGRAM_AUTH_BOT
        scope: RUN_TIME
        value: nicegram_auth_bot
      - key: NICEGRAM_INTERNAL_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_AI_AGENTS_SERVER_TOKEN
